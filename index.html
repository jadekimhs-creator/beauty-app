<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>화장품 다 썼어 💄</title>
    <meta name="description" content="스킨케어/헤어 제품 소모품 재구매 타이밍 앱. 다 떨어질 날짜를 자동 예측해 드려요!">
    <meta name="theme-color" content="#EC4899">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="다 썼어?">
    <link rel="stylesheet" href="style.css?v=20260423_02">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="container">
        <div id="announcement-bar" style="display:none; background: var(--purple-soft); color: var(--purple-accent); padding: 12px 20px; border-radius: var(--radius-sm); margin-bottom: 20px; font-size: 0.85rem; display: flex; align-items: center; gap: 8px;">
            <i data-lucide="megaphone" style="width:16px;"></i>
            <span id="announcement-content"></span>
        </div>

        <header class="header">
            <div class="app-logo">Arch Beauty</div>
            <div style="display:flex; gap:12px;">
                <button class="theme-toggle" id="theme-toggle" title="Toggle Theme">
                    <i data-lucide="moon"></i>
                </button>
                <button class="btn-filter" id="btn-logout" title="Logout"><i data-lucide="log-out"></i></button>
                <button class="btn-filter"><i data-lucide="align-right"></i></button>
            </div>
        </header>

        <div id="insight-area"></div>

        <div class="search-wrap">
            <input type="text" id="search-input" placeholder="Search by name or brand...">
            <i data-lucide="search"></i>
        </div>

        <div class="forecast-section">
            <h3>Next 30 Days Forecast</h3>
            <div class="timeline-scroll" id="timeline-scroll">
                <!-- Timeline items will be injected here -->
            </div>
        </div>

        <div class="greeting">
            <h2 id="greeting-text">Collection</h2>
            <p id="greeting-sub">Your beauty inventory overview.</p>
        </div>

        <div class="summary-cards">
            <div class="sum-card">
                <span class="label">Items</span>
                <div class="value" id="total-count">0</div>
            </div>
            <div class="sum-card">
                <span class="label">Depleting</span>
                <div class="value" id="danger-count">0</div>
            </div>
            <div class="sum-card">
                <span class="label">Warning</span>
                <div class="value" id="warn-count">0</div>
            </div>
        </div>

        <div class="tabs">
            <div class="tab-chip active" data-cat="all">All</div>
            <div class="tab-chip" data-cat="skincare">Skincare</div>
            <div class="tab-chip" data-cat="hair">Hair</div>
            <div class="tab-chip" data-cat="body">Body</div>
            <div class="tab-chip" data-cat="makeup">Makeup</div>
        </div>

        <div id="alert-area"></div>

        <div class="product-list" id="product-list">
            <p style="color:var(--text-muted); font-size:0.8rem; text-transform:uppercase;">Initializing gallery...</p>
        </div>
    </div>

    <a class="fab" href="add.html"><i data-lucide="plus"></i></a>

    <script type="module">
        import { getProducts, calcDaysLeft, renderAlerts, renderProductCard } from './app.js?v=20260423_05';
        import { signOut, getAnnouncements } from './supabaseClient.js?v=20260423_05';

        let currentCat = 'all';
        let sortAsc = true;
        let searchQuery = '';

        async function render() {
            // 공지사항 로드
            const announces = await getAnnouncements();
            const bar = document.getElementById('announcement-bar');
            if (announces && announces.length > 0) {
                bar.style.display = 'flex';
                document.getElementById('announcement-content').textContent = announces[0].content;
            } else {
                bar.style.display = 'none';
            }

            const listEl = document.getElementById('product-list');
            const timelineEl = document.getElementById('timeline-scroll');
            const all = await getProducts();
            
            // 검색 필터링
            const searched = all.filter(p => 
                p.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                (p.brand && p.brand.toLowerCase().includes(searchQuery.toLowerCase()))
            );

            const filtered = currentCat === 'all' ? searched : searched.filter(p => p.category === currentCat);

            // 통계 업데이트
            const danger = all.filter(p => calcDaysLeft(p.openedAt, p.capacityMl, p.dailyUseMl) <= 7).length;
            const warn = all.filter(p => {
                const d = calcDaysLeft(p.openedAt, p.capacityMl, p.dailyUseMl);
                return d > 7 && d <= 30;
            }).length;

            document.getElementById('total-count').textContent = all.length;
            document.getElementById('danger-count').textContent = danger;
            document.getElementById('warn-count').textContent = warn;

            // 타임라인 생성 (다음 30일 이내 소진되는 제품들)
            const timelineItems = all
                .map(p => ({ ...p, daysLeft: calcDaysLeft(p.openedAt, p.capacityMl, p.dailyUseMl) }))
                .filter(p => p.daysLeft >= 0 && p.daysLeft <= 30)
                .sort((a, b) => a.daysLeft - b.daysLeft);

            if (timelineItems.length === 0) {
                timelineEl.innerHTML = '<p style="font-size:0.8rem; color:var(--text-muted); padding: 1rem;">No items depleting soon.</p>';
            } else {
                timelineEl.innerHTML = timelineItems.map(p => `
                    <a href="detail.html?id=${p.id}" class="timeline-tile ${p.daysLeft <= 7 ? 'danger' : ''}">
                        <span class="date">${p.daysLeft === 0 ? 'Today' : `In ${p.daysLeft} days`}</span>
                        <div class="p-name">${p.name}</div>
                    </a>
                `).join('');
            }

            // 인사말 업데이트
            if (danger > 0) {
                document.getElementById('greeting-text').textContent = `Action Required`;
                document.getElementById('greeting-sub').textContent = `${danger} items are nearly empty.`;
            } else {
                document.getElementById('greeting-text').textContent = 'Collection';
                document.getElementById('greeting-sub').textContent = 'Your beauty inventory overview.';
            }

            // 알림 배너
            document.getElementById('alert-area').innerHTML = renderAlerts(all);

            // 정렬 적용
            const sorted = [...filtered].sort((a, b) => {
                const diffA = calcDaysLeft(a.openedAt, a.capacityMl, a.dailyUseMl);
                const diffB = calcDaysLeft(b.openedAt, b.capacityMl, b.dailyUseMl);
                return sortAsc ? diffA - diffB : diffB - diffA;
            });

            if (sorted.length === 0) {
                listEl.innerHTML = `
                <div class="empty-state">
                    <p style="font-size:0.8rem; color:var(--text-muted); text-transform:uppercase;">No results found</p>
                </div>`;
            } else {
                listEl.innerHTML = sorted.map(renderProductCard).join('');
            }

            lucide.createIcons();
        }

        // 검색 이벤트
        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            render();
        });

        // 탭 클릭
        document.querySelectorAll('.tab-chip').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-chip').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCat = btn.dataset.cat;
                render();
            });
        });

        // 초기 렌더링
        render();

        // 필터 버튼 (정렬 전환)
        document.querySelector('.btn-filter').addEventListener('click', () => {
            sortAsc = !sortAsc;
            const icon = document.querySelector('.btn-filter i, .btn-filter svg');
            if (icon) icon.style.transform = sortAsc ? 'rotate(0deg)' : 'rotate(180deg)';
            render();
        });

        // 로그아웃
        document.getElementById('btn-logout').addEventListener('click', async () => {
            if (confirm('로그아웃 하시겠습니까?')) {
                await signOut();
                location.href = 'login.html';
            }
        });

        // ── 관리자 모드 트리거 (로고 5번 클릭) ─────────────────────────────
        let logoClicks = 0;
        document.querySelector('.app-logo').addEventListener('click', () => {
            logoClicks++;
            if (logoClicks >= 5) {
                location.href = 'admin.html';
            }
            setTimeout(() => { logoClicks = 0; }, 2000);
        });

        // ── Theme Management ────────────────────────────────────────────────
        const toggleTheme = () => {
            const current = document.documentElement.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', target);
            localStorage.setItem('theme', target);
            updateThemeIcon();
        };

        const updateThemeIcon = () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const icon = document.querySelector('#theme-toggle i');
            if (icon) {
                icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
                lucide.createIcons();
            }
        };

        document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

        // Set initial theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeIcon();

        // ── Insights ────────────────────────────────────────────────────────
        const insights = [
            { q: "Beauty is about being comfortable in your own skin.", a: "Anonymous" },
            { q: "Drink water, stay hydrated. Your skin will thank you.", a: "Skincare Tip" },
            { q: "Less is more. A simple routine is often the most effective.", a: "Minimalist Beauty" },
            { q: "SPF is your best friend. Every single day.", a: "Essential Tip" },
            { q: "Confidence is the best makeup any woman can wear.", a: "E. Lauder" }
        ];

        const renderInsight = () => {
            const random = insights[Math.floor(Math.random() * insights.length)];
            document.getElementById('insight-area').innerHTML = `
                <div class="insight-card">
                    <div class="quote">${random.q}</div>
                    <div class="author">— ${random.a}</div>
                </div>
            `;
        };
        renderInsight();

        // ── PWA Service Worker + 알림 초기화 ─────────────────────────────
        (async () => {
            if ('serviceWorker' in navigator) {
                try { await navigator.serviceWorker.register('sw.js'); } catch(e) {}
            }
        })();
    </script>
</body>
</html>
