<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>다 썼어? | 스마트 뷰티 인벤토리</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="다 썼어?">
    <link rel="stylesheet" href="style.css?v=20260423_08">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); letter-spacing: -1px; }
        
        /* Insight Dashboard */
        .insight-dashboard {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 32px;
        }
        .insight-card {
            background: var(--glass); backdrop-filter: blur(20px); padding: 20px; border-radius: 28px;
            border: 1px solid var(--border); box-shadow: var(--shadow-sm);
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .insight-card.full { grid-column: span 2; }
        .insight-card .label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; margin-bottom: 4px; }
        .insight-card .value { font-size: 1.4rem; font-weight: 800; color: var(--primary); }
        .insight-card .desc { font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; }
        
        .score-circle {
            width: 40px; height: 40px; border-radius: 50%; background: var(--purple-accent);
            display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 0.9rem;
        }

        .announcement-banner {
            background: var(--primary); color: white; padding: 10px 20px; border-radius: 12px;
            margin-bottom: 20px; display: none; align-items: center; gap: 10px; font-size: 0.85rem;
            animation: slideDown 0.5s ease-out;
        }
        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Announcement Banner -->
        <div class="announcement-banner" id="announcement-banner">
            <i data-lucide="megaphone" style="width:16px;"></i>
            <span id="announcement-content"></span>
        </div>

        <header>
            <div class="header-top">
                <div class="logo">Beauty Shelf</div>
                <div style="display: flex; gap: 12px;">
                    <a href="admin.html" id="admin-link" style="display:none; color:var(--text-muted);"><i data-lucide="shield-check"></i></a>
                    <button class="btn-icon" id="logout-btn"><i data-lucide="log-out"></i></button>
                </div>
            </div>
            
            <div class="insight-dashboard" id="insight-dashboard">
                <div class="insight-card">
                    <div class="label">뷰티 스코어</div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div class="value" id="beauty-score">0</div>
                        <div class="score-circle" id="score-grade">A</div>
                    </div>
                    <div class="desc" id="score-msg">분석 중...</div>
                </div>
                <div class="insight-card">
                    <div class="label">이달의 소진 예정</div>
                    <div class="value" id="expiring-count">0건</div>
                    <div class="desc">30일 내 소진될 제품</div>
                </div>
                <div class="insight-card full">
                    <div class="label">오늘의 추천 루틴</div>
                    <div class="value" id="routine-tip" style="font-size:0.95rem;">데이터를 분석 중입니다...</div>
                </div>
            </div>
        </header>

        <div class="search-wrap" style="margin-bottom: 24px;">
            <input type="text" id="search-input" placeholder="제품 또는 브랜드 검색">
            <i data-lucide="search"></i>
        </div>

        <div class="filter-tabs" id="filter-tabs">
            <button class="filter-tab active" data-cat="all">전체</button>
            <button class="filter-tab" data-cat="skincare">스킨케어</button>
            <button class="filter-tab" data-cat="makeup">메이크업</button>
            <button class="filter-tab" data-cat="hair">헤어</button>
            <button class="filter-tab" data-cat="body">바디</button>
        </div>

        <div id="alert-area"></div>

        <div class="product-grid" id="product-list">
            <!-- Loading state -->
            <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">
                제품 목록을 불러오는 중...
            </div>
        </div>
    </div>

    <a class="fab" href="add.html"><i data-lucide="plus"></i></a>

    <script type="module">
        import { getProducts, calcDaysLeft, renderAlerts, renderProductCard } from './app.js?v=20260423_08';
        import { signOut, getAnnouncements, supabase } from './supabaseClient.js?v=20260423_08';

        let currentCat = 'all';
        let allProducts = [];

        async function updateDashboard(products) {
            const expiringCount = products.filter(p => calcDaysLeft(p.openedAt, p.capacityMl, p.dailyUseMl) <= 30).length;
            document.getElementById('expiring-count').textContent = expiringCount + '건';

            const categories = new Set(products.map(p => p.category)).size;
            const totalCount = products.length;
            let score = Math.min(100, (totalCount * 8) + (categories * 12));
            if (totalCount === 0) score = 0;

            document.getElementById('beauty-score').textContent = score;
            
            const gradeEl = document.getElementById('score-grade');
            const msgEl = document.getElementById('score-msg');
            const tipEl = document.getElementById('routine-tip');

            if (score >= 80) { 
                gradeEl.textContent = 'S'; 
                gradeEl.style.background = 'var(--purple-accent)';
                msgEl.textContent = '완벽한 관리 상태입니다!'; 
                tipEl.textContent = '✨ 루틴이 매우 안정적이에요. 지금처럼만 유지하세요!'; 
            } else if (score >= 40) { 
                gradeEl.textContent = 'A'; 
                gradeEl.style.background = '#3b82f6';
                msgEl.textContent = '꾸준히 관리 중이시네요.'; 
                tipEl.textContent = '🧴 카테고리를 더 다양하게 채우면 점수가 올라가요.'; 
            } else { 
                gradeEl.textContent = 'B'; 
                gradeEl.style.background = '#94a3b8';
                msgEl.textContent = '관리가 더 필요해요.'; 
                tipEl.textContent = '💡 아직 제품이 부족하네요. 화장대 아이템을 더 등록해보세요.'; 
            }
        }

        async function refresh() {
            allProducts = await getProducts();
            await updateDashboard(allProducts);
            renderFiltered();
            document.getElementById('alert-area').innerHTML = renderAlerts(allProducts);
            lucide.createIcons();
        }

        function renderFiltered() {
            const listEl = document.getElementById('product-list');
            const filtered = currentCat === 'all' 
                ? allProducts 
                : allProducts.filter(p => p.category === currentCat);
            
            if (filtered.length === 0) {
                listEl.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:60px; color:var(--text-muted);">제품이 없습니다.</div>';
            } else {
                listEl.innerHTML = filtered.map(renderProductCard).join('');
            }
            lucide.createIcons();
        }

        // Filter events
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentCat = tab.dataset.cat;
                renderFiltered();
            });
        });

        // Search events
        document.getElementById('search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allProducts.filter(p => 
                p.name.toLowerCase().includes(query) || (p.brand && p.brand.toLowerCase().includes(query))
            );
            document.getElementById('product-list').innerHTML = filtered.map(renderProductCard).join('');
            lucide.createIcons();
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            if(confirm('로그아웃 하시겠습니까?')) {
                await signOut();
                window.location.href = 'login.html';
            }
        });

        // Init
        const { data: { user } } = await supabase.auth.getUser();
        if (user) {
            const { data: profile } = await supabase.from('profiles').select('role').eq('id', user.id).single();
            if (profile?.role === 'admin') document.getElementById('admin-link').style.display = 'block';
        }

        refresh();

        // Announcement Logic
        const announces = await getAnnouncements();
        if (announces.length > 0) {
            const banner = document.getElementById('announcement-banner');
            const content = document.getElementById('announcement-content');
            banner.style.display = 'flex';
            let idx = 0;
            content.textContent = announces[idx].content;
            if (announces.length > 1) {
                setInterval(() => {
                    idx = (idx + 1) % announces.length;
                    content.style.opacity = 0;
                    setTimeout(() => {
                        content.textContent = announces[idx].content;
                        content.style.opacity = 1;
                    }, 500);
                }, 4000);
            }
        }
    </script>
</body>
</html>
