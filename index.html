<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>화장품 다 썼어 💄</title>
    <meta name="description" content="스킨케어/헤어 제품 소모품 재구매 타이밍 앱. 다 떨어질 날짜를 자동 예측해 드려요!">
    <meta name="theme-color" content="#EC4899">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="다 썼어?">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <!-- 헤더 -->
    <header class="app-header">
        <span class="app-logo">💄 다 썼어?</span>
        <div class="header-icons">
            <button class="icon-btn" title="정렬" id="sort-btn">
                <i data-lucide="sliders-horizontal" style="width:18px;height:18px;"></i>
            </button>
        </div>
    </header>

    <!-- 인사 배너 -->
    <div class="greeting-banner">
        <h2 id="greeting-text">안녕하세요! 👋</h2>
        <p id="greeting-sub">제품을 등록하고 재구매 타이밍을 놓치지 마세요.</p>
    </div>

    <!-- 요약 칩 -->
    <div class="summary-row">
        <div class="summary-chip">
            <div class="num" id="total-count">0</div>
            <div class="label">등록 제품</div>
        </div>
        <div class="summary-chip danger">
            <div class="num" id="danger-count">0</div>
            <div class="label">7일 이내 소진</div>
        </div>
        <div class="summary-chip warn">
            <div class="num" id="warn-count">0</div>
            <div class="label">30일 내 소진</div>
        </div>
    </div>

    <!-- 경고 배너 (동적) -->
    <div id="alert-area"></div>

    <!-- 탭 필터 -->
    <div class="tab-bar">
        <button class="tab-chip active" data-cat="all">전체</button>
        <button class="tab-chip" data-cat="skincare">🧴 스킨케어</button>
        <button class="tab-chip" data-cat="hair">💇 헤어</button>
        <button class="tab-chip" data-cat="body">🛁 바디</button>
        <button class="tab-chip" data-cat="makeup">💄 메이크업</button>
    </div>

    <!-- 제품 목록 -->
    <div class="product-list" id="product-list">
        <!-- 동적 렌더링 -->
    </div>

    <!-- FAB: 제품 추가 버튼 -->
    <a class="fab" href="add.html" title="제품 추가">+</a>

    <script src="app.js"></script>
    <script>
        let currentCat = 'all';

        function render() {
            const all = getProducts();
            const filtered = currentCat === 'all' ? all : all.filter(p => p.category === currentCat);

            // 요약
            document.getElementById('total-count').textContent = all.length;
            document.getElementById('danger-count').textContent = all.filter(p => {
                const d = calcDaysLeft(p.openedAt, p.capacityMl, p.dailyUseMl);
                return d >= 0 && d <= 7;
            }).length;
            document.getElementById('warn-count').textContent = all.filter(p => {
                const d = calcDaysLeft(p.openedAt, p.capacityMl, p.dailyUseMl);
                return d > 7 && d <= 30;
            }).length;

            // 인사 메시지
            const danger = all.filter(p => calcDaysLeft(p.openedAt, p.capacityMl, p.dailyUseMl) <= 7).length;
            if (danger > 0) {
                document.getElementById('greeting-text').textContent = `⚠️ ${danger}개 제품이 곧 소진돼요!`;
                document.getElementById('greeting-sub').textContent = '얼른 재구매 링크를 확인해 보세요.';
            } else if (all.length > 0) {
                document.getElementById('greeting-text').textContent = '✅ 모든 제품 여유 있어요!';
                document.getElementById('greeting-sub').textContent = '재구매 걱정 없는 하루 보내세요 🌸';
            }

            // 알림 배너
            document.getElementById('alert-area').innerHTML = renderAlerts(all);

            // 제품 목록
            const listEl = document.getElementById('product-list');

            // 남은 일수 오름차순 정렬
            const sorted = [...filtered].sort((a, b) =>
                calcDaysLeft(a.openedAt, a.capacityMl, a.dailyUseMl) -
                calcDaysLeft(b.openedAt, b.capacityMl, b.dailyUseMl)
            );

            if (sorted.length === 0) {
                listEl.innerHTML = `
                <div class="empty-state">
                    <div class="emoji">🛍️</div>
                    <h3>${currentCat === 'all' ? '아직 등록된 제품이 없어요' : '이 카테고리엔 제품이 없어요'}</h3>
                    <p>+ 버튼을 눌러<br>사용 중인 화장품을 등록해 보세요!</p>
                </div>`;
            } else {
                listEl.innerHTML = sorted.map(renderProductCard).join('');
            }

            lucide.createIcons();
        }

        // 탭 클릭
        document.querySelectorAll('.tab-chip').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-chip').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCat = btn.dataset.cat;
                render();
            });
        });

        // 초기 렌더링
        render();

        // (데모) 샘플 데이터 없을 때 시뮬레이션 버튼
        if (getProducts().length === 0) {
            const demo = document.createElement('button');
            demo.textContent = '🧪 샘플 데이터로 체험해보기';
            demo.style.cssText = 'display:block;margin:20px auto;padding:12px 24px;border-radius:12px;border:none;background:var(--pink-soft);color:var(--pink-accent);font-weight:700;cursor:pointer;font-size:0.9rem;';
            demo.addEventListener('click', () => {
                const samples = [
                    { name: '설화수 퍼펙팅 세럼', brand: '설화수', category: 'skincare', capacityMl: 60, dailyUseMl: 0.8, openedAt: '2026-03-01', coupangUrl: '' },
                    { name: '판테닌 샴푸', brand: '판텐', category: 'hair', capacityMl: 400, dailyUseMl: 8, openedAt: '2026-03-15', coupangUrl: '' },
                    { name: '에스트라 아토베리어 크림', brand: '에스트라', category: 'skincare', capacityMl: 80, dailyUseMl: 1.2, openedAt: '2026-04-01', coupangUrl: '' },
                    { name: '니베아 바디로션', brand: '니베아', category: 'body', capacityMl: 250, dailyUseMl: 5, openedAt: '2026-04-10', coupangUrl: '' },
                ];
                samples.forEach(s => addProduct(s));
                render();
                demo.remove();
            });
            document.querySelector('.product-list').after(demo);
        }

        // ── PWA Service Worker + 알림 초기화 ─────────────────────────────
        (async () => {
            if ('serviceWorker' in navigator) {
                try { await navigator.serviceWorker.register('sw.js'); } catch(e) {}
            }

            // 알림 권한 배너 (최초 1회)
            if ('Notification' in window && Notification.permission === 'default') {
                const banner = document.createElement('div');
                banner.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1F1235;color:#fff;padding:14px 20px;border-radius:14px;font-size:0.85rem;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,0.2);z-index:200;max-width:340px;width:90%;';
                banner.innerHTML = `
                    <span>🔔 소진 임박 알림을 받아볼까요?</span>
                    <button id="allow-notif" style="background:#EC4899;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;">📱 허용</button>
                    <button onclick="this.parentElement.remove()" style="background:none;border:none;color:#aaa;cursor:pointer;font-size:1.2rem;flex-shrink:0;">✕</button>
                `;
                document.body.appendChild(banner);
                document.getElementById('allow-notif').addEventListener('click', async () => {
                    const perm = await Notification.requestPermission();
                    banner.remove();
                    if (perm === 'granted') {
                        new Notification('💄 다 썼어?', {
                            body: '소진 임박 알림이 설정되었어요!',
                            icon: 'icons/icon-192.png',
                        });
                    }
                });
                setTimeout(() => banner?.remove(), 10000);
            }
        })();
    </script>
</body>
</html>
