<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>화장품 다 썼어 💄</title>
    <meta name="description" content="스킨케어/헤어 제품 소모품 재구매 타이밍 앱. 다 떨어질 날짜를 자동 예측해 드려요!">
    <meta name="theme-color" content="#EC4899">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="다 썼어?">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="app-logo">💄 다 썼어<span>?</span></div>
            <div class="btn-filter"><i data-lucide="sliders-horizontal" style="width:20px;"></i></div>
        </header>

        <!-- Greeting -->
        <div class="greeting">
            <h2 id="greeting-text">반가워요! ✨</h2>
            <p id="greeting-sub">오늘도 아름다운 하루 보내세요.</p>
        </div>

        <!-- Summary -->
        <div class="summary-cards">
            <div class="sum-card">
                <span class="label">전체 제품</span>
                <span class="value" id="total-count">0</span>
            </div>
            <div class="sum-card">
                <span class="label">소진 임박</span>
                <span class="value" id="danger-count" style="color:var(--accent);">0</span>
            </div>
            <div class="sum-card">
                <span class="label">주의</span>
                <span class="value" id="warn-count" style="color:#f59e0b;">0</span>
            </div>
        </div>

        <!-- Alerts -->
        <div class="alert-area" id="alert-area"></div>

        <!-- Tabs -->
        <div class="tabs">
            <div class="tab-chip active" data-cat="all">전체</div>
            <div class="tab-chip" data-cat="skincare">🧴 스킨케어</div>
            <div class="tab-chip" data-cat="hair">💇 헤어</div>
            <div class="tab-chip" data-cat="body">🛁 바디</div>
            <div class="tab-chip" data-cat="makeup">💄 메이크업</div>
        </div>

        <!-- Product List -->
        <div class="product-list" id="product-list">
            <div class="empty-state">
                <p>데이터 불러오는 중... 🔄</p>
            </div>
        </div>
    </div>

    <!-- FAB -->
    <a class="fab" href="add.html" title="제품 추가">
        <i data-lucide="plus"></i>
    </a>

    <script type="module">
        import { getProducts, calcDaysLeft, renderAlerts, renderProductCard } from './app.js';

        let currentCat = 'all';

        async function render() {
            const listEl = document.getElementById('product-list');
            listEl.innerHTML = '<div class="empty-state"><p>데이터 불러오는 중... 🔄</p></div>';

            const all = await getProducts();
            const filtered = currentCat === 'all' ? all : all.filter(p => p.category === currentCat);

            // 요약
            document.getElementById('total-count').textContent = all.length;
            document.getElementById('danger-count').textContent = all.filter(p => {
                const d = calcDaysLeft(p.openedAt, p.capacityMl, p.dailyUseMl);
                return d >= 0 && d <= 7;
            }).length;
            document.getElementById('warn-count').textContent = all.filter(p => {
                const d = calcDaysLeft(p.openedAt, p.capacityMl, p.dailyUseMl);
                return d > 7 && d <= 30;
            }).length;

            // 인사 메시지
            const danger = all.filter(p => calcDaysLeft(p.openedAt, p.capacityMl, p.dailyUseMl) <= 7).length;
            if (danger > 0) {
                document.getElementById('greeting-text').textContent = `⚠️ ${danger}개 제품이 곧 소진돼요!`;
                document.getElementById('greeting-sub').textContent = '얼른 재구매 링크를 확인해 보세요.';
            } else if (all.length > 0) {
                document.getElementById('greeting-text').textContent = '✅ 모든 제품 여유 있어요!';
                document.getElementById('greeting-sub').textContent = '재구매 걱정 없는 하루 보내세요 🌸';
            }

            // 알림 배너
            document.getElementById('alert-area').innerHTML = renderAlerts(all);

            // 남은 일수 오름차순 정렬
            const sorted = [...filtered].sort((a, b) =>
                calcDaysLeft(a.openedAt, a.capacityMl, a.dailyUseMl) -
                calcDaysLeft(b.openedAt, b.capacityMl, b.dailyUseMl)
            );

            if (sorted.length === 0) {
                listEl.innerHTML = `
                <div class="empty-state">
                    <div class="emoji">🛍️</div>
                    <h3>${currentCat === 'all' ? '아직 등록된 제품이 없어요' : '이 카테고리엔 제품이 없어요'}</h3>
                    <p>+ 버튼을 눌러<br>사용 중인 화장품을 등록해 보세요!</p>
                </div>`;
            } else {
                listEl.innerHTML = sorted.map(renderProductCard).join('');
            }

            lucide.createIcons();
        }

        // 탭 클릭
        document.querySelectorAll('.tab-chip').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-chip').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCat = btn.dataset.cat;
                render();
            });
        });

        // 초기 렌더링
        render();

        // ── 관리자 모드 트리거 (로고 5번 클릭) ─────────────────────────────
        let logoClicks = 0;
        document.querySelector('.app-logo').addEventListener('click', () => {
            logoClicks++;
            if (logoClicks >= 5) {
                location.href = 'admin.html';
            }
            setTimeout(() => { logoClicks = 0; }, 2000);
        });

        // ── PWA Service Worker + 알림 초기화 ─────────────────────────────
        (async () => {
            if ('serviceWorker' in navigator) {
                try { await navigator.serviceWorker.register('sw.js'); } catch(e) {}
            }
        })();
    </script>
</body>
</html>
