<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>다 썼어? | 스마트 뷰티 인벤토리</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="다 썼어?">
    <link rel="stylesheet" href="style.css?v=20260423_09">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .logo { font-size: 1.2rem; font-weight: 800; color: var(--primary); letter-spacing: -1px; }
        
        /* Compact Insight Dashboard */
        .insight-dashboard {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;
        }
        .insight-card {
            background: var(--glass); backdrop-filter: blur(20px); padding: 16px; border-radius: 24px;
            border: 1px solid var(--border); box-shadow: var(--shadow-sm);
        }
        .insight-card.full { grid-column: span 2; }
        .insight-card .label { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; margin-bottom: 2px; }
        .insight-card .value { font-size: 1.2rem; font-weight: 800; color: var(--primary); }
        .insight-card .desc { font-size: 0.65rem; color: var(--text-muted); margin-top: 2px; }
        
        .score-circle {
            width: 32px; height: 32px; border-radius: 50%; background: var(--purple-accent);
            display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 0.8rem;
        }

        /* Compact Routine Section */
        .routine-section {
            background: var(--glass); backdrop-filter: blur(20px); border-radius: 24px;
            border: 1px solid var(--border); padding: 16px; margin-bottom: 24px;
        }
        .routine-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .routine-tabs { display: flex; gap: 6px; }
        .routine-tab {
            padding: 6px 12px; border-radius: 10px; border: none; background: #f1f5f9;
            font-size: 0.75rem; font-weight: 600; cursor: pointer; color: var(--text-muted);
        }
        .routine-tab.active { background: var(--primary); color: white; }
        
        .routine-item {
            display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border);
        }
        .routine-item:last-child { border-bottom: none; }
        .routine-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--purple-accent); }
        .routine-item label { font-size: 0.85rem; font-weight: 500; cursor: pointer; flex: 1; }
        .routine-item.done label { text-decoration: line-through; color: var(--text-muted); opacity: 0.6; }

        .announcement-banner {
            background: var(--primary); color: white; padding: 10px 20px; border-radius: 12px;
            margin-bottom: 20px; display: none; align-items: center; gap: 10px; font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="app-container" style="padding: 16px;">
        <div class="announcement-banner" id="announcement-banner">
            <i data-lucide="megaphone" style="width:16px;"></i>
            <span id="announcement-content"></span>
        </div>

        <header>
            <div class="header-top">
                <div class="logo">Beauty Shelf</div>
                <div style="display: flex; gap: 12px;">
                    <a href="admin.html" id="admin-link" style="display:none; color:var(--text-muted);"><i data-lucide="shield-check"></i></a>
                    <button class="btn-icon" id="logout-btn"><i data-lucide="log-out"></i></button>
                </div>
            </div>
            
            <div class="insight-dashboard" id="insight-dashboard">
                <div class="insight-card">
                    <div class="label">뷰티 스코어</div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div class="value" id="beauty-score">0</div>
                        <div class="score-circle" id="score-grade">A</div>
                    </div>
                    <div class="desc" id="score-msg">분석 중...</div>
                </div>
                <div class="insight-card">
                    <div class="label">소진 예정</div>
                    <div class="value" id="expiring-count">0건</div>
                    <div class="desc">30일 내 소진 예상</div>
                </div>
                <div class="insight-card full">
                    <div class="label">오늘의 추천 루틴</div>
                    <div class="value" id="routine-tip" style="font-size:0.9rem;">데이터를 분석 중입니다...</div>
                </div>
            </div>
        </header>

        <!-- Routine Tracker -->
        <section class="routine-section">
            <div class="routine-header">
                <h3 style="font-size: 1rem; font-weight: 700;">Daily Routine</h3>
                <div class="routine-tabs">
                    <button class="routine-tab active" data-type="morning">아침</button>
                    <button class="routine-tab" data-type="night">저녁</button>
                </div>
            </div>
            <div id="routine-list">
                <!-- Routine items here -->
            </div>
        </section>

        <div class="search-wrap" style="margin-bottom: 24px;">
            <input type="text" id="search-input" placeholder="제품 또는 브랜드 검색">
            <i data-lucide="search"></i>
        </div>

        <div class="filter-tabs" id="filter-tabs">
            <button class="filter-tab active" data-cat="all">전체</button>
            <button class="filter-tab" data-cat="skincare">스킨케어</button>
            <button class="filter-tab" data-cat="makeup">메이크업</button>
            <button class="filter-tab" data-cat="hair">헤어</button>
            <button class="filter-tab" data-cat="body">바디</button>
        </div>

        <div id="alert-area"></div>
        <div class="product-grid" id="product-list"></div>
    </div>

    <a class="fab" href="add.html"><i data-lucide="plus"></i></a>

    <script type="module">
        import { getProducts, calcDaysLeft, renderAlerts, renderProductCard } from './app.js?v=20260423_10';
        import { signOut, getAnnouncements, supabase } from './supabaseClient.js?v=20260423_10';

        let currentCat = 'all';
        let allProducts = [];
        let currentRoutine = 'morning';

        async function updateDashboard(products) {
            const expiringCount = products.filter(p => calcDaysLeft(p.openedAt, p.capacityMl, p.dailyUseMl) <= 30).length;
            document.getElementById('expiring-count').textContent = expiringCount + '건';

            // Base score from inventory
            const categories = new Set(products.map(p => p.category)).size;
            const totalCount = products.length;
            let score = Math.min(100, (totalCount * 5) + (categories * 10));
            
            // Bonus from routine completion
            const doneCount = Object.keys(localStorage).filter(k => k.startsWith('routine_') && localStorage.getItem(k) === 'true').length;
            score = Math.min(100, score + (doneCount * 5));

            document.getElementById('beauty-score').textContent = score;
            const gradeEl = document.getElementById('score-grade');
            const msgEl = document.getElementById('score-msg');
            const tipEl = document.getElementById('routine-tip');

            if (score >= 80) { gradeEl.textContent = 'S'; gradeEl.style.background = '#8b5cf6'; msgEl.textContent = '완벽한 루틴 달성!'; tipEl.textContent = '✨ 피부가 정말 고마워하고 있어요!'; }
            else if (score >= 50) { gradeEl.textContent = 'A'; gradeEl.style.background = '#3b82f6'; msgEl.textContent = '꾸준함이 생명입니다.'; tipEl.textContent = '🧴 빠진 루틴은 없는지 체크해보세요.'; }
            else { gradeEl.textContent = 'B'; gradeEl.style.background = '#94a3b8'; msgEl.textContent = '더 분발해볼까요?'; tipEl.textContent = '💡 인벤토리를 채우고 루틴을 시작해보세요.'; }
        }

        function renderRoutine() {
            const listEl = document.getElementById('routine-list');
            const routineProducts = allProducts.filter(p => currentRoutine === 'morning' ? p.isMorning : p.isNight);
            
            if (routineProducts.length === 0) {
                listEl.innerHTML = `<p style="text-align:center; padding:20px; color:var(--text-muted); font-size:0.8rem;">등록된 ${currentRoutine === 'morning' ? '아침' : '저녁'} 루틴 제품이 없습니다.</p>`;
                return;
            }

            listEl.innerHTML = routineProducts.map(p => {
                const key = `routine_${p.id}_${new Date().toDateString()}`;
                const isDone = localStorage.getItem(key) === 'true';
                return `
                    <div class="routine-item ${isDone ? 'done' : ''}">
                        <input type="checkbox" id="check-${p.id}" ${isDone ? 'checked' : ''} onchange="window.toggleRoutine('${p.id}', this.checked)">
                        <label for="check-${p.id}">${p.name} <span style="font-size:0.7rem; color:var(--text-muted);">(${p.brand || ''})</span></label>
                    </div>
                `;
            }).join('');
        }

        window.toggleRoutine = (id, checked) => {
            const key = `routine_${id}_${new Date().toDateString()}`;
            localStorage.setItem(key, checked);
            refresh(); // To update score
        };

        async function refresh() {
            allProducts = await getProducts();
            await updateDashboard(allProducts);
            renderRoutine();
            renderFiltered();
            document.getElementById('alert-area').innerHTML = renderAlerts(allProducts);
            lucide.createIcons();
        }

        function renderFiltered() {
            const listEl = document.getElementById('product-list');
            const filtered = currentCat === 'all' ? allProducts : allProducts.filter(p => p.category === currentCat);
            listEl.innerHTML = filtered.length === 0 ? '<div style="grid-column:1/-1; text-align:center; padding:40px;">No products.</div>' : filtered.map(renderProductCard).join('');
            lucide.createIcons();
        }

        // Tab logic
        document.querySelectorAll('.routine-tab').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.routine-tab').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentRoutine = btn.dataset.type;
                renderRoutine();
            });
        });

        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentCat = tab.dataset.cat;
                renderFiltered();
            });
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            if(confirm('로그아웃?')) { await signOut(); window.location.href = 'login.html'; }
        });

        refresh();
        lucide.createIcons();
    </script>
</body>
</html>
