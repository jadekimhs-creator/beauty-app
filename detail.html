<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제품 상세 | 다 썼어?</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .detail-info {
            background: var(--bg-alt);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 20px;
            margin-bottom: 32px;
            box-shadow: var(--shadow-sm);
        }
        .info-row {
            display: flex; justify-content: space-between;
            align-items: center; padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }
        .info-row:last-child { border-bottom: none; }
        .info-row .label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .info-row .value { font-size: 1rem; font-weight: 600; color: var(--text); }
        .btn-danger-outline {
            display: block; width: 100%; padding: 18px;
            border: 1.5px solid var(--danger); background: none;
            color: var(--danger); text-align: center; font-weight: 600;
            font-size: 0.85rem; border-radius: var(--radius-sm); cursor: pointer;
            text-transform: uppercase; letter-spacing: 0.1em;
            transition: var(--transition);
        }
        .btn-danger-outline:hover { background: #fff5f5; }
    </style>
</head>
<body>

    <div class="container">
        <header class="detail-header">
            <a href="index.html" class="btn-back-text"><i data-lucide="arrow-left" style="width:14px;"></i> Return to Collection</a>
            <h1 id="detail-name">Product Profile</h1>
        </header>

        <div class="donut-chart">
            <svg viewBox="0 0 120 120">
                <circle class="bg" cx="60" cy="60" r="50"></circle>
                <circle class="fill" id="donut-fill" cx="60" cy="60" r="50" style="stroke-dashoffset: 314;"></circle>
            </svg>
            <div class="donut-text">
                <span class="pct" id="donut-pct">0%</span>
                <span class="label">Remaining</span>
            </div>
        </div>

        <div class="detail-info">
            <div class="info-row">
                <span class="label">Brand</span>
                <span class="value" id="d-brand">-</span>
            </div>
            <div class="info-row">
                <span class="label">Classification</span>
                <span class="value" id="d-cat">-</span>
            </div>
            <div class="info-row">
                <span class="label">Volume</span>
                <span class="value" id="d-cap">-</span>
            </div>
            <div class="info-row">
                <span class="label">Opening Date</span>
                <span class="value" id="d-opened">-</span>
            </div>
            <div class="info-row">
                <span class="label">Projected Runout</span>
                <span class="value" id="d-runout" style="color:var(--text);">-</span>
            </div>
            <div class="info-row">
                <span class="label">Days Remaining</span>
                <span class="value" id="d-days">-</span>
            </div>
        </div>

        <a id="btn-coupang" href="#" target="_blank" class="btn-primary" style="margin-bottom:16px; display:block;">🛒 Replenish Now</a>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
            <a id="btn-edit" href="#" class="btn-secondary-outline" style="text-decoration:none; display:block;">✏️ Modify</a>
            <button id="btn-delete" class="btn-danger-outline">🗑 Remove</button>
        </div>
    </div>

    <script type="module">
        import { getProductById, deleteProduct, calcDaysLeft, calcRemainingPct, calcRunoutDate, getStatus, getCatInfo, formatDate } from './app.js';

        (async () => {
            const id = new URLSearchParams(window.location.search).get('id');
            const p = await getProductById(id);

            if (!p) {
                alert('제품을 찾을 수 없습니다.');
                location.href = 'index.html';
                return;
            }

            const daysLeft = calcDaysLeft(p.openedAt, p.capacityMl, p.dailyUseMl);
            const pct = calcRemainingPct(p.openedAt, p.capacityMl, p.dailyUseMl);
            const runout = calcRunoutDate(p.openedAt, p.capacityMl, p.dailyUseMl);
            const cat = getCatInfo(p.category);
            const status = getStatus(daysLeft);

            // 페이지 타이틀
            document.getElementById('detail-name').textContent = p.name;

            // 도넛 차트
            const circumference = 2 * Math.PI * 50; // ~314
            const offset = circumference * (1 - pct / 100);
            const donutFill = document.getElementById('donut-fill');
            setTimeout(() => { donutFill.style.strokeDashoffset = offset; }, 100);

            if (status === 'danger') donutFill.style.stroke = '#EF4444';
            else if (status === 'warn') donutFill.style.stroke = '#F59E0B';

            document.getElementById('donut-pct').textContent = `${pct}%`;

            // 상세 정보
            document.getElementById('d-brand').textContent = p.brand || '-';
            document.getElementById('d-cat').textContent = `${cat.emoji} ${cat.label}`;
            document.getElementById('d-cap').textContent = `${p.capacityMl}ml`;
            document.getElementById('d-opened').textContent = formatDate(p.openedAt);
            document.getElementById('d-runout').textContent = formatDate(runout);
            document.getElementById('d-days').textContent =
                daysLeft <= 0 ? '이미 소진' : `${daysLeft}일 남음`;

            // 버튼 링크
            const coupangSearchUrl = (q) => `https://www.coupang.com/np/search?q=${encodeURIComponent(q)}`;
            const coupangUrl = p.coupangUrl || coupangSearchUrl(`${p.brand || ''} ${p.name}`);
            document.getElementById('btn-coupang').href = coupangUrl;
            document.getElementById('btn-edit').href = `add.html?edit=${id}`;

            // 삭제
            document.getElementById('btn-delete').addEventListener('click', async () => {
                if (confirm(`"${p.name}"을(를) 삭제할까요?`)) {
                    await deleteProduct(id);
                    location.href = 'index.html';
                }
            });

            // ── Theme Management ────────────────────────────────────────────────
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);

            lucide.createIcons();
        })();
    </script>
</body>
</html>
