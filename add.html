<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제품 등록 | 다 썼어?</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header class="detail-header">
            <a href="index.html" class="btn-circle" style="text-decoration:none;"><i data-lucide="chevron-left" style="width:20px; color:var(--text-sub);"></i></a>
            <h1 id="page-title" style="font-size:1.4rem; font-weight:700;">제품 등록</h1>
        </header>

        <div class="form-group">
            <label>제품명</label>
            <input type="text" id="name" placeholder="예: 설화수 퍼펙팅 세럼">
        </div>

        <div class="form-group">
            <label>브랜드 (선택)</label>
            <input type="text" id="brand" placeholder="예: 설화수">
        </div>

        <div class="form-group">
            <label>카테고리</label>
            <div class="cat-grid">
                <button type="button" class="cat-btn active" data-cat="skincare">🧴 스킨케어</button>
                <button type="button" class="cat-btn" data-cat="hair">💇 헤어</button>
                <button type="button" class="cat-btn" data-cat="body">🛁 바디</button>
                <button type="button" class="cat-btn" data-cat="makeup">💄 메이크업</button>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
                <label>전체 용량 (ml/g)</label>
                <input type="number" id="capacity" placeholder="60">
            </div>
            <div class="form-group">
                <label>1일 사용량 (ml/g)</label>
                <input type="number" id="dailyUse" placeholder="0.8" step="0.1">
            </div>
        </div>

        <div class="form-group">
            <label>개봉 날짜</label>
            <input type="date" id="openedAt">
        </div>

        <div class="form-group">
            <label>쿠팡 재구매 링크 (선택)</label>
            <input type="url" id="coupangUrl" placeholder="https://...">
        </div>

        <!-- Preview Card -->
        <div id="preview-card" style="display:none; margin-top: 24px;">
            <div class="sum-card" style="background: var(--primary); color: white; border: none; text-align: left; padding:20px; border-radius:24px;">
                <span class="label" style="color: rgba(255,255,255,0.7); font-size:0.8rem; margin-bottom:8px;">✨ 예측 결과</span>
                <div id="preview-date" style="font-size:1.1rem; font-weight: 700; margin-bottom: 4px;">-</div>
                <div id="preview-days" style="font-size: 0.9rem; opacity: 0.9;">-</div>
            </div>
        </div>

        <button class="btn-save" id="save-btn">저장하기</button>
    </div>

    <script type="module">
        import { getProductById, addProduct, updateProduct, calcDaysLeft, calcRunoutDate, formatDate } from './app.js';

        // 오늘 날짜 기본값
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('openedAt').value = today;

        let selectedCat = 'skincare';
        let editId = null;

        // URL 파라미터로 수정 모드 감지
        const urlParams = new URLSearchParams(window.location.search);
        editId = urlParams.get('edit');
        
        (async () => {
            if (editId) {
                document.getElementById('page-title').textContent = '제품 수정';
                document.getElementById('save-btn').textContent = '✏️ 수정 완료';
                const p = await getProductById(editId);
                if (p) {
                    document.getElementById('name').value = p.name;
                    document.getElementById('brand').value = p.brand || '';
                    document.getElementById('capacity').value = p.capacityMl;
                    document.getElementById('dailyUse').value = p.dailyUseMl;
                    document.getElementById('openedAt').value = p.openedAt;
                    document.getElementById('coupangUrl').value = p.coupangUrl || '';
                    selectedCat = p.category;
                    document.querySelectorAll('.cat-btn').forEach(b => {
                        b.classList.toggle('active', b.dataset.cat === selectedCat);
                    });
                    updatePreview();
                }
            }
        })();

        // 카테고리 선택
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedCat = btn.dataset.cat;
                updatePreview();
            });
        });

        // 미리보기 업데이트
        function updatePreview() {
            const capacity = parseFloat(document.getElementById('capacity').value);
            const dailyUse = parseFloat(document.getElementById('dailyUse').value);
            const openedAt = document.getElementById('openedAt').value;

            if (capacity > 0 && dailyUse > 0 && openedAt) {
                document.getElementById('preview-card').style.display = 'block';
                const daysLeft = calcDaysLeft(openedAt, capacity, dailyUse);
                const runout = calcRunoutDate(openedAt, capacity, dailyUse);
                document.getElementById('preview-date').textContent = `📅 ${formatDate(runout)} 소진 예상`;

                if (daysLeft <= 0) {
                    document.getElementById('preview-days').textContent = '⚠️ 이미 소진된 날짜예요!';
                } else if (daysLeft <= 7) {
                    document.getElementById('preview-days').textContent = `🚨 ${daysLeft}일 남음 — 얼른 주문하세요!`;
                } else if (daysLeft <= 30) {
                    document.getElementById('preview-days').textContent = `⚡ ${daysLeft}일 남음 — 슬슬 준비하세요`;
                } else {
                    document.getElementById('preview-days').textContent = `✅ ${daysLeft}일 남음 — 여유 있어요!`;
                }
            } else {
                document.getElementById('preview-card').style.display = 'none';
            }
        }

        ['capacity', 'dailyUse', 'openedAt'].forEach(id => {
            document.getElementById(id).addEventListener('input', updatePreview);
        });

        // 저장
        document.getElementById('save-btn').addEventListener('click', async () => {
            const name = document.getElementById('name').value.trim();
            const capacity = parseFloat(document.getElementById('capacity').value);
            const dailyUse = parseFloat(document.getElementById('dailyUse').value);
            const openedAt = document.getElementById('openedAt').value;

            if (!name) return alert('제품명을 입력해주세요.');
            if (!capacity || capacity <= 0) return alert('전체 용량을 입력해주세요.');
            if (!dailyUse || dailyUse <= 0) return alert('1일 사용량을 입력해주세요.');
            if (!openedAt) return alert('개봉일을 선택해주세요.');

            document.getElementById('save-btn').disabled = true;
            document.getElementById('save-btn').textContent = '⏳ 저장 중...';

            const product = {
                name,
                brand: document.getElementById('brand').value.trim(),
                category: selectedCat,
                capacityMl: capacity,
                dailyUseMl: dailyUse,
                openedAt,
                coupangUrl: document.getElementById('coupangUrl').value.trim(),
            };

            if (editId) {
                await updateProduct(editId, product);
            } else {
                await addProduct(product);
            }

            window.location.href = 'index.html';
        });

        lucide.createIcons();
    </script>
</body>
</html>
