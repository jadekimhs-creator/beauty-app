<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제품 등록 | 다 썼어?</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="container">
        <header class="detail-header">
            <a href="index.html" class="btn-back-text"><i data-lucide="arrow-left" style="width:14px;"></i> Return to Collection</a>
            <h1 id="page-title">New Entry</h1>
        </header>

        <div class="form-group">
            <label>Product Name</label>
            <input type="text" id="name" placeholder="Name of product">
        </div>

        <div class="form-group">
            <label>Brand (Optional)</label>
            <input type="text" id="brand" placeholder="Brand name">
        </div>

        <div class="form-group">
            <label>Classification</label>
            <div class="cat-grid">
                <button type="button" class="cat-btn active" data-cat="skincare">Skincare</button>
                <button type="button" class="cat-btn" data-cat="hair">Hair</button>
                <button type="button" class="cat-btn" data-cat="body">Body</button>
                <button type="button" class="cat-btn" data-cat="makeup">Makeup</button>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px;">
            <div class="form-group">
                <label>Volume (ml/g)</label>
                <input type="number" id="capacity" placeholder="0">
            </div>
            <div class="form-group">
                <label>Daily Usage</label>
                <input type="number" id="dailyUse" placeholder="0" step="0.1">
            </div>
        </div>

        <div class="form-group">
            <label>Date Opened</label>
            <input type="date" id="openedAt">
        </div>

        <div class="form-group">
            <label>Reference Link (Optional)</label>
            <input type="url" id="coupangUrl" placeholder="https://...">
        </div>

        <!-- Prediction -->
        <div id="preview-card" style="display:none; margin-bottom: 40px; padding:20px; border:1px solid var(--border);">
            <span class="label" style="font-size:0.7rem; color:var(--text-muted); text-transform:uppercase;">Projection</span>
            <div id="preview-date" style="font-size:1.1rem; margin-top:8px;">-</div>
            <div id="preview-days" style="font-size: 0.8rem; color:var(--text-muted); margin-top:4px;">-</div>
        </div>

        <button class="btn-primary" id="save-btn">Commit Entry</button>
    </div>

    <script type="module">
        import { getProductById, addProduct, updateProduct, calcDaysLeft, calcRunoutDate, formatDate } from './app.js';

        // 오늘 날짜 기본값
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('openedAt').value = today;

        let selectedCat = 'skincare';
        let editId = null;

        // URL 파라미터로 수정 모드 감지
        const urlParams = new URLSearchParams(window.location.search);
        editId = urlParams.get('edit');
        
        (async () => {
            if (editId) {
                document.getElementById('page-title').textContent = '제품 수정';
                document.getElementById('save-btn').textContent = '✏️ 수정 완료';
                const p = await getProductById(editId);
                if (p) {
                    document.getElementById('name').value = p.name;
                    document.getElementById('brand').value = p.brand || '';
                    document.getElementById('capacity').value = p.capacityMl;
                    document.getElementById('dailyUse').value = p.dailyUseMl;
                    document.getElementById('openedAt').value = p.openedAt;
                    document.getElementById('coupangUrl').value = p.coupangUrl || '';
                    selectedCat = p.category;
                    document.querySelectorAll('.cat-btn').forEach(b => {
                        b.classList.toggle('active', b.dataset.cat === selectedCat);
                    });
                    updatePreview();
                }
            }
        })();

        // 카테고리 선택
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedCat = btn.dataset.cat;
                updatePreview();
            });
        });

        // 미리보기 업데이트
        function updatePreview() {
            const capacity = parseFloat(document.getElementById('capacity').value);
            const dailyUse = parseFloat(document.getElementById('dailyUse').value);
            const openedAt = document.getElementById('openedAt').value;

            if (capacity > 0 && dailyUse > 0 && openedAt) {
                document.getElementById('preview-card').style.display = 'block';
                const daysLeft = calcDaysLeft(openedAt, capacity, dailyUse);
                const runout = calcRunoutDate(openedAt, capacity, dailyUse);
                document.getElementById('preview-date').textContent = `📅 ${formatDate(runout)} 소진 예상`;

                if (daysLeft <= 0) {
                    document.getElementById('preview-days').textContent = '⚠️ 이미 소진된 날짜예요!';
                } else if (daysLeft <= 7) {
                    document.getElementById('preview-days').textContent = `🚨 ${daysLeft}일 남음 — 얼른 주문하세요!`;
                } else if (daysLeft <= 30) {
                    document.getElementById('preview-days').textContent = `⚡ ${daysLeft}일 남음 — 슬슬 준비하세요`;
                } else {
                    document.getElementById('preview-days').textContent = `✅ ${daysLeft}일 남음 — 여유 있어요!`;
                }
            } else {
                document.getElementById('preview-card').style.display = 'none';
            }
        }

        ['capacity', 'dailyUse', 'openedAt'].forEach(id => {
            document.getElementById(id).addEventListener('input', updatePreview);
        });

        // 저장
        document.getElementById('save-btn').addEventListener('click', async () => {
            const name = document.getElementById('name').value.trim();
            const capacity = parseFloat(document.getElementById('capacity').value);
            const dailyUse = parseFloat(document.getElementById('dailyUse').value);
            const openedAt = document.getElementById('openedAt').value;

            if (!name) return alert('제품명을 입력해주세요.');
            if (!capacity || capacity <= 0) return alert('전체 용량을 입력해주세요.');
            if (!dailyUse || dailyUse <= 0) return alert('1일 사용량을 입력해주세요.');
            if (!openedAt) return alert('개봉일을 선택해주세요.');

            document.getElementById('save-btn').disabled = true;
            document.getElementById('save-btn').textContent = '⏳ 저장 중...';

            const product = {
                name,
                brand: document.getElementById('brand').value.trim(),
                category: selectedCat,
                capacityMl: capacity,
                dailyUseMl: dailyUse,
                openedAt,
                coupangUrl: document.getElementById('coupangUrl').value.trim(),
            };

            if (editId) {
                await updateProduct(editId, product);
            } else {
                await addProduct(product);
            }

            window.location.href = 'index.html';
        });

        // ── Theme Management ────────────────────────────────────────────────
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        lucide.createIcons();
    </script>
</body>
</html>
