<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>관리자 프리미엄 대시보드</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #f8fafc;
            --primary: #1e293b;
            --accent: #ec4899;
            --glass: rgba(255, 255, 255, 0.8);
            --border: rgba(226, 232, 240, 0.8);
            --text-main: #1e293b;
            --text-sub: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;
        }

        .btn-back {
            display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text-sub);
            font-weight: 500; padding: 8px 16px; background: var(--glass); border-radius: 12px;
            backdrop-filter: blur(10px); border: 1px solid var(--border); transition: all 0.2s;
        }
        .btn-back:hover { transform: translateX(-4px); color: var(--primary); }

        .title-group h1 { font-size: 1.8rem; font-weight: 700; color: var(--primary); letter-spacing: -0.5px; }
        .title-group p { font-size: 0.9rem; color: var(--text-sub); }

        /* Stats Grid */
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px;
        }
        .stat-card {
            background: var(--glass); backdrop-filter: blur(20px); padding: 24px; border-radius: 24px;
            border: 1px solid var(--border); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
        }
        .stat-card .label { font-size: 0.85rem; color: var(--text-sub); font-weight: 500; margin-bottom: 8px; }
        .stat-card .value { font-size: 2rem; font-weight: 700; color: var(--primary); }

        /* Main Layout */
        .admin-grid {
            display: grid; grid-template-columns: 2fr 1fr; gap: 30px;
        }

        @media (max-width: 1000px) {
            .admin-grid { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--glass); backdrop-filter: blur(20px); border-radius: 24px; border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); overflow: hidden; margin-bottom: 30px;
        }
        .card-header {
            padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex;
            justify-content: space-between; align-items: center;
        }
        .card-header h2 { font-size: 1.1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { background: rgba(248, 250, 252, 0.5); padding: 12px 16px; text-align: left; color: var(--text-sub); font-weight: 600; }
        td { padding: 12px 16px; border-bottom: 1px solid var(--border); }
        
        /* Insights */
        .insight-list { padding: 20px; }
        .insight-item {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
            padding: 12px; background: rgba(255,255,255,0.4); border-radius: 12px;
        }
        .insight-item .name { font-weight: 600; font-size: 0.9rem; }
        .insight-item .count { color: var(--accent); font-weight: 700; }

        /* Announcements */
        .announce-form { padding: 20px; border-bottom: 1px solid var(--border); }
        .announce-form input {
            width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 10px;
        }
        .btn-action {
            width: 100%; padding: 12px; border-radius: 12px; border: none; background: var(--primary);
            color: white; font-weight: 600; cursor: pointer;
        }
        .announce-list { padding: 10px 20px; }
        .announce-item {
            padding: 12px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between;
        }
        .announce-item:last-child { border-bottom: none; }

        .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 600; }
        .badge.skincare { background: #fee2e2; color: #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="btn-back"><i data-lucide="chevron-left"></i> 돌아가기</a>
            <div class="title-group">
                <h1>Premium Dashboard</h1>
                <p>Data-Driven Beauty Management</p>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card"><div class="label">총 사용자</div><div class="value" id="stat-users">0</div></div>
            <div class="stat-card"><div class="label">총 제품</div><div class="value" id="stat-total">0</div></div>
            <div class="stat-card"><div class="label">소진 임박</div><div class="value" id="stat-danger" style="color:#ef4444;">0</div></div>
        </div>

        <div class="admin-grid">
            <!-- Left: Main Lists -->
            <div class="main-content">
                <div class="card">
                    <div class="card-header"><h2><i data-lucide="users"></i> 사용자 계정 및 활동</h2></div>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr><th>이메일</th><th>제품 수</th><th>마지막 접속</th></tr>
                            </thead>
                            <tbody id="user-tbody"></tbody>
                        </table>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header"><h2><i data-lucide="package"></i> 전체 제품 모니터링</h2></div>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr><th>제품명</th><th>소유자</th><th>카테고리</th><th>남은양</th></tr>
                            </thead>
                            <tbody id="product-tbody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Right: Insights & Announcements -->
            <div class="side-content">
                <div class="card">
                    <div class="card-header"><h2><i data-lucide="bar-chart-3"></i> 인기 브랜드 TOP 5</h2></div>
                    <div class="insight-list" id="brand-insight"></div>
                </div>

                <div class="card">
                    <div class="card-header"><h2><i data-lucide="bell"></i> 공지사항 관리</h2></div>
                    <div class="announce-form">
                        <input type="text" id="new-announce" placeholder="공지 내용을 입력하세요...">
                        <button class="btn-action" id="btn-add-announce">공지 게시</button>
                    </div>
                    <div class="announce-list" id="announce-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { getAllProducts, deleteProduct, calcRemainingPct } from './app.js?v=2';
        import { getUserProfile, getProfiles, getAnnouncements, addAnnouncement, deleteAnnouncement } from './supabaseClient.js?v=2';

        const profile = await getUserProfile();
        if (!profile || profile.role !== 'admin') { window.location.href = 'index.html'; }

        async function refresh() {
            const products = await getAllProducts();
            const profiles = await getProfiles();
            const announces = await getAnnouncements();

            // Stats
            document.getElementById('stat-users').textContent = profiles.length;
            document.getElementById('stat-total').textContent = products.length;

            // User Table
            const userProductCount = {};
            products.forEach(p => userProductCount[p.userId] = (userProductCount[p.userId] || 0) + 1);
            document.getElementById('user-tbody').innerHTML = profiles.map(pr => `
                <tr>
                    <td><b>${pr.email}</b></td>
                    <td>${userProductCount[pr.id] || 0}개</td>
                    <td style="color:var(--text-sub); font-size:0.75rem;">${pr.last_login_at ? new Date(pr.last_login_at).toLocaleString() : '-'}</td>
                </tr>
            `).join('');

            // Product Table
            const userMap = {}; profiles.forEach(pr => userMap[pr.id] = pr.email);
            document.getElementById('product-tbody').innerHTML = products.map(p => `
                <tr>
                    <td>${p.name}</td>
                    <td style="font-size:0.75rem;">${userMap[p.userId] || '-'}</td>
                    <td><span class="badge skincare">${p.category}</span></td>
                    <td>${calcRemainingPct(p.openedAt, p.capacityMl, p.dailyUseMl)}%</td>
                </tr>
            `).join('');

            // Brand Insight
            const brandCount = {};
            products.forEach(p => { if(p.brand) brandCount[p.brand] = (brandCount[p.brand] || 0) + 1; });
            const topBrands = Object.entries(brandCount).sort((a,b) => b[1]-a[1]).slice(0, 5);
            document.getElementById('brand-insight').innerHTML = topBrands.map(([name, count]) => `
                <div class="insight-item">
                    <span class="name">${name}</span>
                    <span class="count">${count}개</span>
                </div>
            `).join('') || '<p style="padding:20px; color:var(--text-sub); text-align:center;">데이터 없음</p>';

            // Announcements
            document.getElementById('announce-list').innerHTML = announces.map(a => `
                <div class="announce-item">
                    <span style="font-size:0.85rem;">${a.content}</span>
                    <button onclick="window.delAnnounce('${a.id}')" style="background:none; border:none; color:var(--accent); cursor:pointer;">삭제</button>
                </div>
            `).join('');

            lucide.createIcons();
        }

        window.delAnnounce = async (id) => {
            if(confirm('이 공지를 삭제할까요?')) {
                await deleteAnnouncement(id);
                refresh();
            }
        };

        document.getElementById('btn-add-announce').addEventListener('click', async () => {
            const content = document.getElementById('new-announce').value.trim();
            if(!content) return;
            await addAnnouncement(content);
            document.getElementById('new-announce').value = '';
            refresh();
        });

        refresh();
        lucide.createIcons();
    </script>
</body>
</html>
