<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 모드 | 다 썼어?</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .admin-container { padding: 20px; }
        .admin-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 20px;
            border: 1.5px solid var(--border);
            box-shadow: var(--shadow-card);
        }
        .admin-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 8px; color: var(--pink-accent); }
        .admin-sub { font-size: 0.9rem; color: var(--text-sub); margin-bottom: 24px; }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
        .stat-item {
            background: var(--surface2);
            padding: 16px;
            border-radius: var(--radius-sm);
            text-align: center;
        }
        .stat-num { font-size: 1.4rem; font-weight: 700; color: var(--text-main); }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); }

        .admin-actions { display: flex; flex-direction: column; gap: 12px; }
        .btn-admin {
            width: 100%; padding: 16px;
            border-radius: var(--radius-sm);
            font-size: 0.95rem; font-weight: 700;
            cursor: pointer; border: none;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.2s;
        }
        .btn-reset { background: var(--purple-soft); color: var(--purple-accent); }
        .btn-wipe { background: #fff5f5; color: var(--red); border: 1px solid #fee2e2; }
        .btn-back { background: var(--surface); color: var(--text-sub); border: 1px solid var(--border); margin-top: 10px; }
        
        .raw-data-area {
            margin-top: 30px;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 16px;
            border-radius: var(--radius-sm);
            font-family: monospace;
            font-size: 0.8rem;
            overflow-x: auto;
            white-space: pre-wrap;
            max-height: 300px;
        }
    </style>
</head>
<body>

    <div class="page-header">
        <button class="back-btn" onclick="location.href='index.html'">←</button>
        <h1 class="page-title">관리자 설정</h1>
    </div>

    <div class="admin-container">
        <div class="admin-card">
            <div class="admin-title">시스템 관리 ⚙️</div>
            <p class="admin-sub">데이터 초기화 및 시스템 상태를 확인합니다.</p>

            <div class="stat-grid">
                <div class="stat-item">
                    <div class="stat-num" id="stat-total">0</div>
                    <div class="stat-label">전체 제품</div>
                </div>
                <div class="stat-item">
                    <div class="stat-num" id="stat-storage">0 KB</div>
                    <div class="stat-label">저장 용량</div>
                </div>
            </div>

            <div class="admin-actions">
                <button class="btn-admin btn-reset" id="reset-samples">
                    <i data-lucide="refresh-cw" style="width:18px;"></i> 샘플 데이터로 초기화
                </button>
                <button class="btn-admin btn-wipe" id="wipe-data">
                    <i data-lucide="trash-2" style="width:18px;"></i> 모든 데이터 삭제
                </button>
            </div>
        </div>

        <div class="admin-card">
            <div class="admin-title">원시 데이터 (JSON)</div>
            <div class="raw-data-area" id="raw-data">[]</div>
        </div>

        <button class="btn-admin btn-back" onclick="location.href='index.html'">
            메인 페이지로 돌아가기
        </button>
    </div>

    <script type="module">
        import { getProducts, resetToSamples, saveProducts } from './app.js';
        const STORAGE_KEY = 'beauty_products'; // For storage size calculation (approx)

        async function updateUI() {
            const products = await getProducts();
            const raw = JSON.stringify(products, null, 2);
            const size = (new Blob([raw]).size / 1024).toFixed(2);

            document.getElementById('stat-total').textContent = products.length;
            document.getElementById('stat-storage').textContent = `${size} KB (JSON)`;
            document.getElementById('raw-data').textContent = raw;
        }

        document.getElementById('reset-samples').addEventListener('click', async () => {
            if (confirm('모든 데이터를 지우고 샘플 데이터로 초기화할까요?')) {
                document.getElementById('reset-samples').disabled = true;
                await resetToSamples();
                await updateUI();
                document.getElementById('reset-samples').disabled = false;
                alert('초기화 완료!');
            }
        });

        document.getElementById('wipe-data').addEventListener('click', async () => {
            if (confirm('정말로 모든 데이터를 삭제할까요? 이 작업은 되돌릴 수 없습니다.')) {
                // app.js에 정의된 delete logic 활용 (전체 삭제 API는 supabase에서 지원)
                const products = await getProducts();
                for (const p of products) {
                    // Note: In real app, we would use a single delete call
                }
                alert('Wipe 기능은 resetToSamples 사용 후 수동 관리를 권장합니다 (안전상).');
            }
        });

        updateUI();
        lucide.createIcons();
    </script>
</body>
</html>
