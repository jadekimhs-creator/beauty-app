<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>관리자 대시보드 - 다 썼어?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #f8fafc;
            --primary: #1e293b;
            --accent: #ec4899;
            --glass: rgba(255, 255, 255, 0.8);
            --border: rgba(226, 232, 240, 0.8);
            --text-main: #1e293b;
            --text-sub: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .btn-back {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-sub);
            font-weight: 500;
            padding: 8px 16px;
            background: var(--glass);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            transition: all 0.2s;
        }
        .btn-back:hover { transform: translateX(-4px); color: var(--primary); }

        .title-group h1 { font-size: 1.8rem; font-weight: 700; color: var(--primary); letter-spacing: -0.5px; }
        .title-group p { font-size: 0.9rem; color: var(--text-sub); }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 24px;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
        }
        .stat-card .label { font-size: 0.85rem; color: var(--text-sub); font-weight: 500; margin-bottom: 8px; }
        .stat-card .value { font-size: 2rem; font-weight: 700; color: var(--primary); }
        .stat-card .unit { font-size: 1rem; margin-left: 4px; color: var(--text-sub); }

        /* Content Area */
        .card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            overflow: hidden;
            margin-bottom: 30px;
        }

        .card-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-header h2 { font-size: 1.1rem; font-weight: 600; }

        .table-wrap { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th {
            background: rgba(248, 250, 252, 0.5);
            padding: 14px 20px;
            text-align: left;
            color: var(--text-sub);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.4); }

        .badge {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge.skincare { background: #fee2e2; color: #ef4444; }
        .badge.hair { background: #fef3c7; color: #d97706; }
        .badge.body { background: #dcfce7; color: #16a34a; }
        .badge.makeup { background: #fce7f3; color: #db2777; }

        .actions { display: flex; gap: 8px; }
        .btn-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: white;
            cursor: pointer;
            color: var(--text-sub);
            transition: all 0.2s;
        }
        .btn-icon:hover { background: #f1f5f9; color: var(--primary); }
        .btn-icon.delete:hover { background: #fee2e2; color: #ef4444; border-color: #fecaca; }

        /* JSON Preview */
        #raw-data {
            background: #1e293b;
            color: #94a3b8;
            padding: 20px;
            border-radius: 16px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            max-height: 300px;
            overflow-y: auto;
            margin: 0 24px 24px;
        }

        /* Danger Zone */
        .danger-zone {
            background: linear-gradient(135deg, #fff1f2 0%, #ffe4e6 100%);
            border: 1px solid #fecaca;
            border-radius: 24px;
            padding: 24px;
        }
        .danger-zone h2 { color: #be123c; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .danger-actions { display: flex; gap: 12px; flex-wrap: wrap; }
        
        .btn-danger {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        .btn-danger.secondary { background: white; color: #be123c; border: 1px solid #fecaca; }
        .btn-danger.primary { background: #be123c; color: white; box-shadow: 0 4px 12px rgba(190, 18, 60, 0.2); }
        .btn-danger:hover { transform: translateY(-2px); opacity: 0.9; }
        .btn-danger:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        @media (max-width: 600px) {
            .stats-grid { grid-template-columns: 1fr; }
            .card-header { flex-direction: column; gap: 12px; align-items: flex-start; }
            td:nth-child(3), th:nth-child(3) { display: none; } /* Hide brand on mobile */
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="btn-back">
                <i data-lucide="chevron-left"></i> 돌아가기
            </a>
            <div class="title-group">
                <h1>Admin Dashboard</h1>
                <p>Supabase Cloud Data Management</p>
            </div>
        </header>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">총 등록 제품</div>
                <div class="value" id="stat-total">0</div>
            </div>
            <div class="stat-card">
                <div class="label">소진 임박 (7일 내)</div>
                <div class="value" id="stat-danger" style="color: #ef4444;">0</div>
            </div>
            <div class="stat-card">
                <div class="label">데이터 크기</div>
                <div class="value" id="stat-size">0<span class="unit">KB</span></div>
            </div>
        </div>

        <!-- Product Table -->
        <div class="card">
            <div class="card-header">
                <h2>전체 제품 리스트</h2>
                <div id="loading-spinner" style="display:none; font-size: 0.85rem; color: var(--accent);">
                    🔄 동기화 중...
                </div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>제품명</th>
                            <th>카테고리</th>
                            <th>브랜드</th>
                            <th>개봉일</th>
                            <th>남은양</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody id="product-tbody">
                        <!-- JS로 채워짐 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Users Table -->
        <div class="card">
            <div class="card-header">
                <h2>전체 사용자 계정</h2>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>가입 이메일</th>
                            <th>권한</th>
                            <th>가입일시</th>
                        </tr>
                    </thead>
                    <tbody id="user-tbody">
                        <tr><td colspan="3" style="text-align:center; padding:20px; color:var(--text-sub);">조회 중...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Raw Data Preview -->
        <div class="card">
            <div class="card-header">
                <h2>Raw JSON Data (Preview)</h2>
            </div>
            <pre id="raw-data">{ "status": "fetching..." }</pre>
        </div>

        <!-- Danger Zone -->
        <div class="danger-zone">
            <h2><i data-lucide="alert-triangle"></i> Danger Zone</h2>
            <p style="color: #9f1239; margin-bottom: 20px; font-size: 0.9rem;">이 작업은 Supabase 서버의 실제 데이터를 직접 수정합니다. 신중하게 실행해 주세요.</p>
            <div class="danger-actions">
                <button id="reset-samples" class="btn-danger secondary">🧪 샘플 데이터로 리셋</button>
                <button id="wipe-data" class="btn-danger primary">🔥 모든 데이터 영구 삭제</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { getProducts, deleteProduct, resetToSamples, calcRemainingPct } from './app.js';
        import { getUserProfile, getProfiles } from './supabaseClient.js';

        // 어드민 권한 체크
        const profile = await getUserProfile();
        if (!profile || profile.role !== 'admin') {
            alert('접근 권한이 없습니다. (어드민 전용)');
            window.location.href = 'index.html';
        }

        async function refreshData() {
            const spinner = document.getElementById('loading-spinner');
            spinner.style.display = 'block';

            const products = await getProducts();
            
            // 통계 업데이트
            document.getElementById('stat-total').textContent = products.length;
            
            const dangerCount = products.filter(p => {
                const totalDays = p.capacityMl / p.dailyUseMl;
                const daysUsed = Math.floor((new Date() - new Date(p.openedAt)) / (1000 * 60 * 60 * 24));
                return (totalDays - daysUsed) <= 7;
            }).length;
            document.getElementById('stat-danger').textContent = dangerCount;

            const raw = JSON.stringify(products, null, 2);
            const sizeKB = (new Blob([raw]).size / 1024).toFixed(2);
            document.getElementById('stat-size').textContent = sizeKB;
            document.getElementById('raw-data').textContent = raw;

            // 테이블 렌더링
            const tbody = document.getElementById('product-tbody');
            if (products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:40px; color:var(--text-sub);">데이터가 없습니다.</td></tr>';
            } else {
                tbody.innerHTML = products.map(p => `
                    <tr>
                        <td style="font-weight:600;">${p.name}</td>
                        <td><span class="badge ${p.category}">${p.category}</span></td>
                        <td style="color:var(--text-sub);">${p.brand || '-'}</td>
                        <td>${p.openedAt}</td>
                        <td>${calcRemainingPct(p.openedAt, p.capacityMl, p.dailyUseMl)}%</td>
                        <td>
                            <div class="actions">
                                <a href="add.html?edit=${p.id}" class="btn-icon" title="수정"><i data-lucide="edit-3" style="width:14px;"></i></a>
                                <button class="btn-icon delete" onclick="window.adminDelete('${p.id}', '${p.name}')" title="삭제">
                                    <i data-lucide="trash-2" style="width:14px;"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            }

            spinner.style.display = 'none';

            // 유저 목록 렌더링
            const profiles = await getProfiles();
            const utbody = document.getElementById('user-tbody');
            if (profiles.length === 0) {
                utbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding:20px; color:var(--text-sub);">사용자가 없습니다.</td></tr>';
            } else {
                utbody.innerHTML = profiles.map(pr => {
                    const dateStr = new Date(pr.created_at).toLocaleString('ko-KR');
                    const roleBadge = pr.role === 'admin' ? '<span class="badge" style="background:#fee2e2; color:#ef4444;">Admin</span>' : '<span class="badge" style="background:#f1f5f9; color:#64748b;">User</span>';
                    return `
                    <tr>
                        <td style="font-weight:600;">${pr.email}</td>
                        <td>${roleBadge}</td>
                        <td style="color:var(--text-sub);">${dateStr}</td>
                    </tr>
                    `;
                }).join('');
            }

            lucide.createIcons();
        }

        // 개별 삭제 핸들러 (전역 노출)
        window.adminDelete = async (id, name) => {
            if (confirm(`"${name}" 제품을 Supabase에서 영구적으로 삭제할까요?`)) {
                await deleteProduct(id);
                await refreshData();
            }
        };

        // 샘플 리셋
        document.getElementById('reset-samples').addEventListener('click', async () => {
            if (confirm('모든 데이터를 지우고 샘플 데이터(설화수 등)로 초기화할까요?')) {
                const btn = document.getElementById('reset-samples');
                btn.disabled = true;
                btn.textContent = '⏳ 리셋 중...';
                await resetToSamples();
                await refreshData();
                btn.disabled = false;
                btn.textContent = '🧪 샘플 데이터로 리셋';
                alert('Supabase 데이터가 샘플로 초기화되었습니다.');
            }
        });

        // 전체 삭제
        document.getElementById('wipe-data').addEventListener('click', async () => {
            if (confirm('정말로 모든 데이터를 삭제할까요? 이 작업은 되돌릴 수 없습니다.')) {
                const btn = document.getElementById('wipe-data');
                btn.disabled = true;
                btn.textContent = '⏳ 삭제 중...';
                
                const products = await getProducts();
                for (const p of products) {
                    await deleteProduct(p.id);
                }
                
                await refreshData();
                btn.disabled = false;
                btn.textContent = '🔥 모든 데이터 영구 삭제';
                alert('모든 데이터가 삭제되었습니다.');
            }
        });

        // 초기 실행
        refreshData();
        lucide.createIcons();
    </script>
</body>
</html>
