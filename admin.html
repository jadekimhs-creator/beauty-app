<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>관리자 프리미엄 대시보드</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #f8fafc;
            --primary: #1e293b;
            --accent: #ec4899;
            --glass: rgba(255, 255, 255, 0.8);
            --border: rgba(226, 232, 240, 0.8);
            --text-main: #1e293b;
            --text-sub: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;
        }

        .btn-back {
            display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text-sub);
            font-weight: 500; padding: 8px 16px; background: var(--glass); border-radius: 12px;
            backdrop-filter: blur(10px); border: 1px solid var(--border); transition: all 0.2s;
        }
        .btn-back:hover { transform: translateX(-4px); color: var(--primary); }

        .title-group h1 { font-size: 1.8rem; font-weight: 700; color: var(--primary); letter-spacing: -0.5px; }
        .title-group p { font-size: 0.9rem; color: var(--text-sub); }

        /* Stats Grid */
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px;
        }
        .stat-card {
            background: var(--glass); backdrop-filter: blur(20px); padding: 24px; border-radius: 24px;
            border: 1px solid var(--border); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
        }
        .stat-card .label { font-size: 0.85rem; color: var(--text-sub); font-weight: 500; margin-bottom: 8px; }
        .stat-card .value { font-size: 2rem; font-weight: 700; color: var(--primary); }

        /* Admin Grid Layout */
        .admin-layout {
            display: grid; grid-template-columns: 350px 1fr 300px; gap: 20px;
        }

        @media (max-width: 1200px) {
            .admin-layout { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--glass); backdrop-filter: blur(20px); border-radius: 24px; border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); overflow: hidden; margin-bottom: 20px;
            display: flex; flex-direction: column;
        }
        .card-header {
            padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex;
            justify-content: space-between; align-items: center; background: rgba(255,255,255,0.4);
        }
        .card-header h2 { font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }

        /* Tables */
        .table-wrap { overflow-x: auto; flex-grow: 1; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        th { background: rgba(248, 250, 252, 0.5); padding: 12px 16px; text-align: left; color: var(--text-sub); font-weight: 600; }
        td { padding: 12px 16px; border-bottom: 1px solid var(--border); }
        
        #user-tbody tr { cursor: pointer; transition: background 0.2s; }
        #user-tbody tr:hover { background: rgba(236, 72, 153, 0.05); }
        #user-tbody tr.selected { background: rgba(236, 72, 153, 0.1); border-left: 4px solid var(--accent); }

        /* User Detail List */
        .detail-item {
            display: flex; justify-content: space-between; padding: 12px 16px;
            border-bottom: 1px solid var(--border); transition: all 0.2s;
        }
        .detail-item:last-child { border-bottom: none; }
        .detail-item .info { display: flex; flex-direction: column; }
        .detail-item .name { font-weight: 600; color: var(--primary); }
        .detail-item .meta { font-size: 0.75rem; color: var(--text-sub); }
        .detail-item .pct { font-weight: 700; color: var(--accent); text-align: right; }

        /* Side Components */
        .insight-list { padding: 16px; }
        .insight-item {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
            padding: 10px; background: rgba(255,255,255,0.4); border-radius: 12px;
        }
        .insight-item .name { font-weight: 600; font-size: 0.85rem; }
        .insight-item .count { color: var(--accent); font-weight: 700; }

        .announce-form { padding: 16px; border-bottom: 1px solid var(--border); }
        .announce-form input {
            width: 100%; padding: 10px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 8px; font-size: 0.85rem;
        }
        .btn-action {
            width: 100%; padding: 10px; border-radius: 12px; border: none; background: var(--primary);
            color: white; font-weight: 600; cursor: pointer; font-size: 0.85rem;
        }
        .announce-list { padding: 10px 16px; }
        .announce-item {
            padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
        }

        .badge { padding: 3px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: 600; background: #fee2e2; color: #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="btn-back"><i data-lucide="chevron-left"></i> 돌아가기</a>
            <div class="title-group">
                <h1>Premium Dashboard</h1>
                <p>Data-Driven Beauty Management</p>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card"><div class="label">총 사용자</div><div class="value" id="stat-users">0</div></div>
            <div class="stat-card"><div class="label">총 제품</div><div class="value" id="stat-total">0</div></div>
            <div class="stat-card"><div class="label">소진 임박</div><div class="value" id="stat-danger" style="color:#ef4444;">0</div></div>
        </div>

        <div class="admin-layout">
            <!-- Left: User Accounts -->
            <div class="card" style="height: fit-content;">
                <div class="card-header"><h2><i data-lucide="users"></i> 사용자 (클릭 시 상세)</h2></div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr><th>이메일</th><th>제품</th></tr>
                        </thead>
                        <tbody id="user-tbody"></tbody>
                    </table>
                </div>
            </div>

            <!-- Middle: User Specific Inventory -->
            <div class="card" id="user-detail-card">
                <div class="card-header">
                    <h2><i data-lucide="search"></i> <span id="detail-user-name">사용자를 선택하세요</span></h2>
                </div>
                <div id="user-inventory-list" style="flex-grow:1; min-height: 200px;">
                    <p style="padding:40px; text-align:center; color:var(--text-sub);">사용자 계정을 클릭하면 등록한 제품들이 여기에 표시됩니다.</p>
                </div>
            </div>

            <!-- Right: Insights & Announcements -->
            <div class="side-panel">
                <div class="card">
                    <div class="card-header"><h2><i data-lucide="bar-chart-3"></i> 인기 브랜드</h2></div>
                    <div class="insight-list" id="brand-insight"></div>
                </div>

                <div class="card">
                    <div class="card-header"><h2><i data-lucide="bell"></i> 공지 관리</h2></div>
                    <div class="announce-form">
                        <input type="text" id="new-announce" placeholder="공지 내용 입력...">
                        <button class="btn-action" id="btn-add-announce">공지 게시</button>
                    </div>
                    <div class="announce-list" id="announce-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { getAllProducts, deleteProduct, calcRemainingPct } from './app.js?v=20260423_06';
        import { getUserProfile, getProfiles, getAnnouncements, addAnnouncement, deleteAnnouncement } from './supabaseClient.js?v=20260423_06';

        const profile = await getUserProfile();
        if (!profile || profile.role !== 'admin') { window.location.href = 'index.html'; }

        let allProducts = [];
        let allProfiles = [];

        async function refresh() {
            allProducts = await getAllProducts();
            allProfiles = await getProfiles();
            const announces = await getAnnouncements();

            document.getElementById('stat-users').textContent = allProfiles.length;
            document.getElementById('stat-total').textContent = allProducts.length;

            const userProductCount = {};
            allProducts.forEach(p => {
                const uid = p.userId || p.user_id || p.uid; // 모든 가능성 체크
                if (uid) {
                    userProductCount[uid] = (userProductCount[uid] || 0) + 1;
                }
            });
            
            document.getElementById('user-tbody').innerHTML = allProfiles.map(pr => `
                <tr id="user-row-${pr.id}" onclick="window.selectUser('${pr.id}', '${pr.email}')">
                    <td><b>${pr.email}</b></td>
                    <td>${userProductCount[pr.id] || 0}개</td>
                </tr>
            `).join('');

            const brandCount = {};
            allProducts.forEach(p => { if(p.brand) brandCount[p.brand] = (brandCount[p.brand] || 0) + 1; });
            const topBrands = Object.entries(brandCount).sort((a,b) => b[1]-a[1]).slice(0, 5);
            document.getElementById('brand-insight').innerHTML = topBrands.map(([name, count]) => `
                <div class="insight-item">
                    <span class="name">${name}</span>
                    <span class="count">${count}개</span>
                </div>
            `).join('') || '<p style="padding:20px; color:var(--text-sub); text-align:center;">데이터 없음</p>';

            document.getElementById('announce-list').innerHTML = announces.map(a => `
                <div class="announce-item">
                    <span style="font-size:0.85rem;">${a.content}</span>
                    <button onclick="window.delAnnounce('${a.id}')" style="background:none; border:none; color:var(--accent); cursor:pointer;"><i data-lucide="trash-2" style="width:14px;"></i></button>
                </div>
            `).join('');

            lucide.createIcons();
        }

        window.selectUser = (userId, email) => {
            // Select row UI
            document.querySelectorAll('#user-tbody tr').forEach(r => r.classList.remove('selected'));
            const row = document.getElementById(`user-row-${userId}`);
            if(row) row.classList.add('selected');

            const userProducts = allProducts.filter(p => (p.userId === userId || p.user_id === userId));
            document.getElementById('detail-user-name').textContent = email;
            const listEl = document.getElementById('user-inventory-list');
            
            if (userProducts.length === 0) {
                listEl.innerHTML = '<p style="padding:40px; text-align:center; color:var(--text-sub);">등록된 제품이 없습니다.</p>';
            } else {
                listEl.innerHTML = userProducts.map(p => `
                    <div class="detail-item">
                        <div class="info">
                            <span class="name">${p.name}</span>
                            <span class="meta">${p.brand || 'No Brand'} · ${p.category}</span>
                        </div>
                        <div class="pct">
                            <div>${calcRemainingPct(p.openedAt, p.capacityMl, p.dailyUseMl)}%</div>
                            <div style="font-size:0.65rem; color:var(--text-sub); font-weight:400;">REMAINING</div>
                        </div>
                    </div>
                `).join('');
            }
            lucide.createIcons();
        };

        window.delAnnounce = async (id) => {
            if(confirm('이 공지를 삭제할까요?')) {
                await deleteAnnouncement(id);
                refresh();
            }
        };

        document.getElementById('btn-add-announce').addEventListener('click', async () => {
            const content = document.getElementById('new-announce').value.trim();
            if(!content) return;
            await addAnnouncement(content);
            document.getElementById('new-announce').value = '';
            refresh();
        });

        refresh();
        lucide.createIcons();
    </script>
</body>
</html>
